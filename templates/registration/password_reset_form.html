{% extends 'base.html' %}
{% block title %}Parola yenileme · Paten Akış{% endblock %}
{% block auth_content %}
<main class="auth-page"><section class="auth-card">
  <span class="brand-mark large">P</span><p class="eyebrow">HESAP ERİŞİMİ</p>
  <h1>Parolanı yenile</h1><p class="muted">Hesabındaki e-posta adresini yaz. Yenileme bağlantısını gönderelim.</p>
  <form method="post" class="stack">{% csrf_token %}
    <label>{{ form.email.label }}{{ form.email }}{% for error in form.email.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>
    <button class="button primary" type="submit">Bağlantı gönder</button>
  </form>
  <p class="muted"><a href="{% url 'login' %}">Girişe dön</a></p>
</section></main>
{% endblock %}
