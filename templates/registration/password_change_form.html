{% extends 'base.html' %}
{% block title %}Parola değiştir · Paten Akış{% endblock %}
{% block page_heading %}Parola değiştir{% endblock %}
{% block content %}
<section class="panel narrow-panel"><div class="panel-head"><div><p class="eyebrow">HESAP GÜVENLİĞİ</p><h2>Yeni parola belirle</h2></div></div>
  <form method="post" class="stack">{% csrf_token %}
    {% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}
    <button class="button primary" type="submit">Parolayı güncelle</button>
  </form>
</section>
{% endblock %}
